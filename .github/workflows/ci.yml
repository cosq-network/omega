name: Omega Kernel CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    container:
      image: alpine:3.19
      options: --user root

    steps:
      - name: Install Git & Basic Tools
        run: apk add --no-cache git bash

      - name: Mark Workspace as Safe Git Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Build Dependencies & Toolchains
        run: |
          apk add --no-cache build-base cmake ninja clang17 llvm17 lld qemu-system-x86_64 qemu-system-aarch64 qemu-system-riscv64 qemu-img mtools dosfstools xorriso tcl tk make

      - name: Auto Increment Patch Version & Generate Release Changelog
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          
          # Retrieve previous tag if available
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          if [ -f VERSION ]; then
              RAW_VER=$(cat VERSION | tr -d ' \n')
              CUR_VER=$(echo "$RAW_VER" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || echo "0.0.1")
          else
              CUR_VER="0.0.1"
          fi
          
          NEW_VER=$(echo $CUR_VER | awk -F. '{$NF = $NF + 1; print $1"."$2"."$3}')
          NEW_TAG="v${NEW_VER}"
          
          # Generate Changelog from PREV_TAG to HEAD
          echo "## 🚀 Release Changelog (${NEW_TAG})" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          if [ -n "$PREV_TAG" ]; then
              echo "### Changes since ${PREV_TAG}:" >> RELEASE_NOTES.md
              git log ${PREV_TAG}..HEAD --oneline --no-merges | sed 's/^/- /' >> RELEASE_NOTES.md
          else
              echo "### Initial Release Changes:" >> RELEASE_NOTES.md
              git log -n 20 --oneline --no-merges | sed 's/^/- /' >> RELEASE_NOTES.md
          fi
          echo "" >> RELEASE_NOTES.md
          echo "### Supported Target Architectures:" >> RELEASE_NOTES.md
          echo "- **x86_64 (AMD64)**: 64-bit Long Mode, PML4 Paging, Xen PVH" >> RELEASE_NOTES.md
          echo "- **AArch64 (ARM64)**: EL1 Mode, VBAR_EL1 Exception Vector Table" >> RELEASE_NOTES.md
          echo "- **RISC-V 64 (rv64gc)**: S-Mode, Sv39 Paging, stvec, OpenSBI Console" >> RELEASE_NOTES.md
          
          echo "${NEW_VER}" > VERSION
          echo "Bumping version from ${CUR_VER} to ${NEW_VER}"
          
          git add VERSION
          git commit -m "chore(version): bump version to v${NEW_VER} [skip ci]" || true
          git tag "${NEW_TAG}" || true
          git push origin main --tags || true

      - name: Read Current Version String
        id: get_version
        run: |
          RAW_VER=$(cat VERSION | tr -d ' \n')
          CLEAN_VER=$(echo "$RAW_VER" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || echo "0.0.1")
          echo "SYS_VERSION=v${CLEAN_VER}" >> $GITHUB_ENV
          echo "System Version Identified: v${CLEAN_VER}"

      - name: Run Multi-Arch QEMU Kernel Integration Tests
        run: |
          chmod +x scripts/test.sh
          ./scripts/test.sh

      - name: Run VGA Display Module Tests
        run: |
          chmod +x scripts/test_display.sh
          ./scripts/test_display.sh

      - name: Generate Bootable Disk Images (RAW, QCOW2, VMDK, VDI)
        run: |
          chmod +x scripts/create_bootable_disk.sh
          ./scripts/create_bootable_disk.sh

      - name: Package Human-Friendly Binary & Disk Assets
        run: |
          mkdir -p artifacts_release
          
          # Clean & Human-Friendly Kernel ELF Binaries
          cp build/x86_64/omega.elf artifacts_release/omega-x86_64.elf
          cp build/aarch64/omega.elf artifacts_release/omega-aarch64.elf
          cp build/riscv64/omega.elf artifacts_release/omega-riscv64.elf
          
          # Clean & Human-Friendly Virtual Disk Images
          cp disk_images/omega-x86_64-bootable.img artifacts_release/omega-x86_64.img
          cp disk_images/omega-x86_64-bootable.qcow2 artifacts_release/omega-x86_64.qcow2
          cp disk_images/omega-x86_64-bootable.vmdk artifacts_release/omega-x86_64.vmdk
          cp disk_images/omega-x86_64-bootable.vdi artifacts_release/omega-x86_64.vdi
          
          cp disk_images/omega-aarch64-bootable.img artifacts_release/omega-aarch64.img
          cp disk_images/omega-aarch64-bootable.qcow2 artifacts_release/omega-aarch64.qcow2
          cp disk_images/omega-aarch64-bootable.vmdk artifacts_release/omega-aarch64.vmdk
          cp disk_images/omega-aarch64-bootable.vdi artifacts_release/omega-aarch64.vdi
          
          cp disk_images/omega-riscv64-bootable.img artifacts_release/omega-riscv64.img
          cp disk_images/omega-riscv64-bootable.qcow2 artifacts_release/omega-riscv64.qcow2
          cp disk_images/omega-riscv64-bootable.vmdk artifacts_release/omega-riscv64.vmdk
          cp disk_images/omega-riscv64-bootable.vdi artifacts_release/omega-riscv64.vdi

      - name: Run Bootable Disk Image Verification Test Suite
        run: |
          chmod +x scripts/test_disk_images.sh
          ./scripts/test_disk_images.sh

      - name: Run Omega Virtual Device (OVD) Integration Tests
        run: |
          chmod +x emulator/test_ovd.sh
          ./emulator/test_ovd.sh

      - name: Run OVD Tcl/Tk GUI Unit Tests
        run: |
          chmod +x emulator/test_ovd_gui.tcl
          tclsh emulator/test_ovd_gui.tcl

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omega-${{ env.SYS_VERSION }}
          path: artifacts_release/

      - name: Publish Official GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.SYS_VERSION }}
          name: Omega OS ${{ env.SYS_VERSION }}
          body_path: RELEASE_NOTES.md
          files: artifacts_release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
